name: Build Nova

# Same rhythm as MintKey: push to main, GitHub builds both installers and
# publishes a release named from version.txt. Bump that file to cut a new one.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    name: macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read version
        id: v
        run: echo "n=$(cat version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # Every release is signed with the same certificate. macOS ties Nova's
      # Accessibility and Screen Recording permissions to the signer, so a
      # stable one keeps them across updates; an ad-hoc signature does not.
      - name: Load the signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then
            echo "::error::The MAC_CERT_P12 secret is missing. Without it macOS would drop Nova's permissions on update."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -f pkcs12 -t cert -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/signing.p12"

      - name: Build the disk image
        env:
          NOVA_VERSION: ${{ steps.v.outputs.n }}
          NOVA_SIGN_IDENTITY: Nova Code Signing
        run: bash packaging/build-macos.sh

      - name: Rename to a stable download name
        run: |
          mkdir -p out
          cp dist/*.dmg out/Nova.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: Nova-Mac
          path: out/Nova.dmg
          if-no-files-found: error

  build-windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Build the icon
        run: python make_icon.py

      - name: Build Nova.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name Nova --icon nova.ico
          --hidden-import tkinter --hidden-import PIL._tkinter_finder
          --hidden-import sqlite3
          --collect-all tkinterdnd2 --collect-all pillow_heif
          --collect-submodules nova --paths .
          packaging/nova_app.py

      - name: Zip it
        run: Compress-Archive -Path dist/Nova/* -DestinationPath Nova-Windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Nova-Windows
          path: Nova-Windows.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-mac, build-windows, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: v
        run: echo "n=$(cat version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with: { name: Nova-Mac, path: assets }
      - uses: actions/download-artifact@v8
        with: { name: Nova-Windows, path: assets }

      - name: Create or update the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.n }}
          name: Nova v${{ steps.v.outputs.n }}
          files: assets/*
          generate_release_notes: true

  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyflakes pytest -r requirements.txt
      - run: python -m pyflakes nova main.py packaging/nova_app.py tests
      - run: python -m pytest -q
